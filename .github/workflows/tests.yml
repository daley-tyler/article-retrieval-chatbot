name: Retrieval tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install unit-test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_retrieval.py' -v

  model:
    name: MiniLM integration (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --only-binary=:all: torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install prepared runtime dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check dependencies and CPU runtime
        run: |
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
      # This step downloads the pinned public model from Hugging Face, without a token.
      - name: Download and load pinned MiniLM model
        run: python -c "from rag_chatbot import ArticleRAGChatbot; ArticleRAGChatbot()"
      - name: Run all unit and real-model tests offline
        env:
          RAG_RUN_MODEL_TESTS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -s tests -v
